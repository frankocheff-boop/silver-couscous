<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Villa Manager  Elegante</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">VM</div>
        <div>
          <h1>Villa Manager</h1>
          <div class="subtitle" id="upcoming-count">0 grupos programados</div>
        </div>
      </div>

      <div class="controls">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden><path d="M21 21l-4.35-4.35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="q" placeholder="Buscar por nombre o villa..." />
        </div>
        <div class="filters" id="filters"></div>
      </div>
    </header>

    <div class="wrap">
      
    <div class="controls" style="display:flex;gap:12px;align-items:center;margin-bottom:14px">
      <button id="newGroupBtn" class="btn secondary">+ Nuevo Grupo</button>
      <div class="calendar-wrapper" style="position:relative">
        <button id="calendarToggle" class="btn ghost small" aria-expanded="false" aria-controls="calendarDropdown">Calendario </button>
        <div id="calendarDropdown" class="calendar-dropdown" aria-hidden="true" style="display:none;position:absolute;top:44px;left:0;z-index:60;">
          <div id="calendar" style="width:320px;max-width:40vw"></div>
        </div>
      </div>
      <div style="flex:1"></div>
    </div>

    <!-- New Group Modal placeholder -->
    <div id="newGroupModal" aria-hidden="true" style="display:none"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 4px 18px 4px">
          <h2 style="margin:0;font-size:16px">Próximas Llegadas</h2>
          <div style="color:var(--muted);font-size:13px" id="stats"></div>
        </div>

        <div class="grid" id="list"></div>
      </main>

      <aside class="panel" id="panel" aria-hidden="true"></aside>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
