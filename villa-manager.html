<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Villa Manager  Elegante</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --muted:#64748b; --accent:#6366f1; --accent-2:#7c3aed; --glass:rgba(255,255,255,0.6);
      --success:#10b981; --danger:#ef4444; --radius:12px;
      --shadow-sm: 0 2px 8px rgba(18,23,40,0.06);
      --shadow-lg: 0 18px 50px rgba(15,23,42,0.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#0f172a;background:linear-gradient(180deg,var(--bg),#eef2ff)}
    .app{display:flex;flex-direction:column;height:100vh}

    header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;backdrop-filter: blur(6px);background:linear-gradient(90deg, rgba(255,255,255,0.6), rgba(255,255,255,0.35));border-bottom:1px solid rgba(15,23,42,0.04)}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;font-weight:700;box-shadow:var(--shadow-sm)}
    h1{margin:0;font-size:18px}
    .subtitle{font-size:13px;color:var(--muted)}

    .controls{display:flex;gap:12px;align-items:center}
    .search{display:flex;align-items:center;background:var(--card);padding:8px 12px;border-radius:999px;border:1px solid rgba(15,23,42,0.04);box-shadow:var(--shadow-sm)}
    .search input{border:0;outline:0;font-size:13px;background:transparent}

    .filters{display:flex;gap:8px}
    .pill{padding:8px 12px;border-radius:999px;font-size:13px;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;transition:all .18s}
    .pill.active{background:linear-gradient(90deg, rgba(99,102,241,0.1), rgba(124,58,237,0.08));color:var(--accent);box-shadow:0 6px 20px rgba(124,58,237,0.06);border-color:rgba(99,102,241,0.12)}

    .wrap{display:flex;flex:1;overflow:hidden;padding:18px}
    .list{flex:1;overflow:auto;padding-right:18px}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
    .card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid rgba(15,23,42,0.04);box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s;cursor:pointer}
    .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
    .card.selected{outline:3px solid rgba(99,102,241,0.08);box-shadow:0 24px 60px rgba(99,102,241,0.06)}

    .row{display:flex;align-items:center;gap:12px}
    .date{width:72px;height:72px;border-radius:10px;background:linear-gradient(180deg,#f8fafc,#eef2ff);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(15,23,42,0.04)}
    .date small{font-size:11px;color:var(--muted);text-transform:uppercase}
    .date strong{font-size:20px}

    .meta{display:flex;flex-direction:column}
    .title{font-weight:600;font-size:16px;color:#0f172a}
    .meta-row{display:flex;align-items:center;gap:8px;margin-top:6px}
    .badge{background:linear-gradient(90deg,rgba(99,102,241,0.09),rgba(124,58,237,0.07));padding:6px 10px;border-radius:999px;font-size:12px;color:var(--accent);border:1px solid rgba(99,102,241,0.08)}

    .foot{margin-top:10px;color:var(--muted);font-size:13px}

    aside.panel{width:440px;border-left:0;background:linear-gradient(180deg,#fff, #fbfdff);box-shadow: -12px 0 30px rgba(9,10,13,0.02);overflow:auto;border-radius:16px 0 0 16px}
    .panel-header{padding:28px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;border-radius:16px 0 0 0;position:relative}
    .panel-body{padding:18px}
    .tabs{display:flex;background:transparent;border-bottom:1px solid rgba(15,23,42,0.04);gap:6px;margin-bottom:10px}
    .tab{flex:1;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.06);text-align:center;font-weight:600;color:rgba(255,255,255,0.9);cursor:pointer}
    .tab.active{background:#fff;color:var(--accent);box-shadow:0 10px 30px rgba(2,6,23,0.06);transform:translateY(-3px);color:var(--accent)}

    .input-row{display:flex;gap:8px;margin-bottom:12px}
    .input-row input{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06)}
    .btn{padding:10px 12px;border-radius:10px;border:0;background:var(--accent);color:white;font-weight:700;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(15,23,42,0.06);color:var(--muted)}

    .list-item{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fff,#fcfdff);padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.04);margin-bottom:10px}
    .list-item .text{flex:1}
    .list-item.completed .text{opacity:.5;text-decoration:line-through}

    .empty{padding:40px;text-align:center;color:var(--muted)}

    @media(max-width:980px){
      .wrap{flex-direction:column}
      aside.panel{width:100%;position:fixed;right:0;top:0;bottom:0;transform:translateX(110%);transition:transform .22s ease;border-radius:0}
      aside.panel.open{transform:translateX(0)}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">VM</div>
        <div>
          <h1>Villa Manager</h1>
          <div class="subtitle" id="upcoming-count">0 grupos programados</div>
        </div>
      </div>

      <div class="controls">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden><path d="M21 21l-4.35-4.35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="q" placeholder="Buscar por nombre o villa..." />
        </div>
        <div class="filters" id="filters"></div>
      </div>
    </header>

    <div class="wrap">
      <main class="list">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 4px 18px 4px">
          <h2 style="margin:0;font-size:16px">Próximas Llegadas</h2>
          <div style="color:var(--muted);font-size:13px" id="stats"></div>
        </div>

        <div class="grid" id="list"></div>
      </main>

      <aside class="panel" id="panel" aria-hidden="true"></aside>
    </div>
  </div>

  <script>
    // Datos base
    const rawData = [
      { name: "Hufmans R-V", start: "22 Nov", end: "26 Nov", year: 2025, villa: "River View & Alegre", type: "mixed" },
      { name: "Reservación VV", start: "22 Nov", end: "29 Nov", year: 2025, villa: "Villa Verano", type: "vv" },
      { name: "Jonathan", start: "27 Nov", end: "04 Dic", year: 2025, villa: "Beach House", type: "bh" },
      { name: "John Chuards", start: "11 Dic", end: "25 Dic", year: 2025, villa: "Beach House", type: "bh" },
      { name: "Jibril Yones", start: "12 Dic", end: "17 Dic", year: 2025, villa: "Villa Verano", type: "vv" },
      { name: "Keneth", start: "26 Dic", end: "03 Ene", year: 2025, endYear: 2026, villa: "Beach House", type: "bh" },
      { name: "Carolin Robinson", start: "27 Dic", end: "04 Ene", year: 2025, endYear: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Greg Leeh", start: "04 Ene", end: "07 Ene", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Tereza Leeh", start: "04 Ene", end: "10 Ene", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Ken Angor", start: "10 Ene", end: "24 Ene", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Ronald B.", start: "25 Ene", end: "01 Feb", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Cristina Dueñas", start: "28 Ene", end: "01 Feb", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Melisa G.", start: "06 Feb", end: "14 Feb", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Cherry Cliford", start: "14 Feb", end: "21 Feb", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Andy D.", start: "14 Feb", end: "19 Feb", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Mike Walter", start: "19 Feb", end: "23 Feb", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Darci D.", start: "21 Feb", end: "28 Feb", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "John Chuards", start: "23 Feb", end: "16 Mar", year: 2026, villa: "Beach House", type: "bh" },
      { name: "Gay Trata", start: "06 Mar", end: "10 Mar", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Cherry Mackinons", start: "13 Abr", end: "19 Abr", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Michelle C.", start: "23 Abr", end: "27 Abr", year: 2026, villa: "Todas las Villas", type: "all" },
      { name: "Lori Arzola", start: "27 Abr", end: "03 May", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Viki Sol", start: "05 May", end: "10 May", year: 2026, villa: "VV & BH", type: "mixed" },
      { name: "Patricia S.", start: "12 May", end: "16 May", year: 2026, villa: "Todas las Villas", type: "all" },
      { name: "Robert J.", start: "21 May", end: "26 May", year: 2026, villa: "Villa Verano", type: "vv" },
      { name: "Pool H.", start: "28 May", end: "01 Jun", year: 2026, villa: "Todas las Villas", type: "all" }
    ];

    // Persistencia
    const STORAGE_KEY = 'villa_manager_data_v1';
    function saveState(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations)); }
      catch(e){ console.warn('No se pudo guardar en localStorage', e); }
    }
    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return false;
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)){
          reservations = parsed;
          return true;
        }
      }catch(e){ console.warn('Error leyendo estado', e); }
      return false;
    }

    // Estado
    let reservations = rawData.map((r,i)=>({ id:i, ...r, status:'confirmed', itinerary:[], shoppingList:[], notes:'' }));
    // si hay estado en localStorage, cargarlo
    loadState();

    let filter = 'all';
    let selectedId = null;
    let activeTab = 'info';

    // Refs
    const listEl = document.getElementById('list');
    const panelEl = document.getElementById('panel');
    const filtersEl = document.getElementById('filters');
    const upcomingCountEl = document.getElementById('upcoming-count');
    const statsEl = document.getElementById('stats');
    const qEl = document.getElementById('q');

    function renderFilters(){
      const opts = [{k:'all',t:'Todos'},{k:'vv',t:'Villa Verano'},{k:'bh',t:'Beach House'},{k:'mixed',t:'Mixto'}];
      filtersEl.innerHTML='';
      opts.forEach(o=>{
        const b = document.createElement('button'); b.className='pill' + (filter===o.k? ' active':'');
        b.textContent = o.t; b.onclick = ()=>{ filter=o.k; render(); };
        filtersEl.appendChild(b);
      })
    }

    function matchesQuery(r,q){
      if(!q) return true;
      q = q.toLowerCase();
      return String(r.name).toLowerCase().includes(q) || String(r.villa).toLowerCase().includes(q);
    }

    function filtered(){
      let list = reservations.filter(r=> matchesQuery(r, qEl.value));
      if(filter==='all') return list;
      if(filter==='vv') return list.filter(r=>r.type==='vv');
      if(filter==='bh') return list.filter(r=>r.type==='bh');
      if(filter==='mixed') return list.filter(r=>r.type==='mixed' || r.type==='all');
      return list;
    }

    function renderList(){
      listEl.innerHTML='';
      const items = filtered();
      items.forEach(r=>{
        const card = document.createElement('div'); card.className='card' + (selectedId===r.id? ' selected':'');
        card.onclick = ()=>{ selectedId=r.id; openPanel(); render(); };

        const row = document.createElement('div'); row.className='row';
        const date = document.createElement('div'); date.className='date';
        const [d,m] = (r.start||'').split(' ');
        const sm = document.createElement('small'); sm.textContent = m || '';
        const sd = document.createElement('strong'); sd.textContent = d || '';
        date.appendChild(sm); date.appendChild(sd);

        const meta = document.createElement('div'); meta.className='meta';
        const title = document.createElement('div'); title.className='title'; title.textContent = r.name;
        const mr = document.createElement('div'); mr.className='meta-row';
        const badge = document.createElement('div'); badge.className='badge'; badge.textContent = r.villa;
        const end = document.createElement('div'); end.style.color='var(--muted)'; end.style.fontSize='13px'; end.textContent = `${r.end} · ${r.year}`;
        mr.appendChild(badge); mr.appendChild(end);

        meta.appendChild(title); meta.appendChild(mr);

        row.appendChild(date); row.appendChild(meta);
        card.appendChild(row);

        if((r.itinerary && r.itinerary.length) || (r.shoppingList && r.shoppingList.length)){
          const foot = document.createElement('div'); foot.className='foot';
          foot.textContent = (r.itinerary && r.itinerary.length? r.itinerary.length + ' Actividades':'') + (r.itinerary && r.itinerary.length && r.shoppingList && r.shoppingList.length? ' · ': '') + (r.shoppingList && r.shoppingList.length? r.shoppingList.length + ' Compras':'');
          card.appendChild(foot);
        }

        listEl.appendChild(card);
      })

      upcomingCountEl.textContent = reservations.filter(r=> r.year===2026 || (r.year===2025 && String(r.start).includes('Dic')) ).length + ' grupos programados';
      statsEl.textContent = items.length + ' resultados';
    }

    function openPanel(){ panelEl.classList.add('open'); panelEl.setAttribute('aria-hidden','false'); renderPanel(); }
    function closePanel(){ saveState(); selectedId=null; panelEl.classList.remove('open'); panelEl.setAttribute('aria-hidden','true'); render(); }

    function renderPanel(){
      const r = reservations.find(x=>x.id===selectedId);
      if(!r){ panelEl.innerHTML = `<div style="padding:28px;text-align:center;color:var(--muted)"><h3>Selecciona un grupo</h3><p>Haz clic en una tarjeta para ver detalles, itinerario y lista de compras.</p></div>`; return; }

      panelEl.innerHTML = '';
      const header = document.createElement('div'); header.className='panel-header';
      header.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><div style=\"font-weight:700;font-size:20px\">${r.name}</div><div style=\"opacity:.9;margin-top:6px\">${r.start}  ${r.end} · ${r.year}</div></div><div style=\"text-align:right\"><div style=\"font-size:13px;opacity:.9\">${r.villa}</div><button id=\"closePanelBtn\" style=\"margin-top:12px;padding:8px 12px;border-radius:10px;border:0;background:rgba(255,255,255,0.12);color:white;cursor:pointer\">Cerrar</button></div></div>`;
      panelEl.appendChild(header);
      document.getElementById('closePanelBtn').onclick = closePanel;

      const body = document.createElement('div'); body.className='panel-body';

      const tabs = document.createElement('div'); tabs.className='tabs';
      ['info','itinerary','shopping'].forEach(t=>{ const b=document.createElement('div'); b.className='tab'+(activeTab===t? ' active':''); b.textContent = t==='info'? 'Resumen' : t==='itinerary' ? 'Itinerario' : 'Compras'; b.onclick=()=>{ activeTab=t; renderPanel(); }; tabs.appendChild(b); });
      body.appendChild(tabs);

      if(activeTab==='info'){
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:8px">Detalles de Alojamiento</div><div style=\"display:flex;gap:12px;align-items:center\"><div style=\"width:64px;height:64px;border-radius:12px;background:linear-gradient(90deg,rgba(99,102,241,0.12),rgba(124,58,237,0.12));display:grid;place-items:center;font-weight:700;color:var(--accent)\">${r.name.split(' ').map(n=>n[0]).slice(0,2).join('')}</div><div><div style=\"font-weight:700\">${r.villa}</div><div style=\"color:var(--muted);margin-top:6px\">${r.year} · Reserva confirmada</div></div></div>`;
        body.appendChild(card);

        const notes = document.createElement('div'); notes.className='card'; notes.style.marginTop='12px';
        notes.innerHTML = `<div style=\"font-weight:700;margin-bottom:8px\">Observaciones</div><textarea id=\"notes\" style=\"width:100%;min-height:120px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);padding:10px\">${r.notes||''}</textarea><div style=\"text-align:right;margin-top:8px\"><button id=\"saveNote\" class=\"btn\">Guardar observaciones</button></div>`;
        body.appendChild(notes);

        // Attach handler immediately (no timeout)
        body.addEventListener('click', (e)=>{
          if(e.target && e.target.id === 'saveNote'){
            const ta = document.getElementById('notes');
            if(ta){ r.notes = ta.value; saveState(); render(); }
          }
        });
      }

      if(activeTab==='itinerary'){
        const add = document.createElement('div'); add.className='card'; add.innerHTML = `<div style=\"font-weight:700;margin-bottom:8px\">Agregar Actividad</div>`;
        const row = document.createElement('div'); row.className='input-row'; const input = document.createElement('input'); input.placeholder='Ej. Cena bienvenida, Tour en bote...'; const addBtn = document.createElement('button'); addBtn.className='btn'; addBtn.textContent='Agregar'; addBtn.onclick = ()=>{ if(input.value.trim()){ r.itinerary = r.itinerary || []; r.itinerary.push({ id:Date.now(), text:input.value, completed:false }); input.value=''; saveState(); renderPanel(); renderList(); }}; row.appendChild(input); row.appendChild(addBtn); add.appendChild(row); body.appendChild(add);

        if(!r.itinerary || r.itinerary.length===0){ body.appendChild(Object.assign(document.createElement('div'),{className:'empty',innerHTML:'<div>Sin itinerario definido</div>'})); }
        else{ r.itinerary.forEach(it=>{ const li = document.createElement('div'); li.className='list-item'+(it.completed? ' completed':''); const chk = document.createElement('input'); chk.type='checkbox'; chk.checked=!!it.completed; chk.onchange = ()=>{ it.completed = chk.checked; saveState(); renderPanel(); renderList(); }; const txt = document.createElement('div'); txt.className='text'; txt.textContent = it.text; const del = document.createElement('button'); del.className='btn ghost'; del.textContent='Eliminar'; del.onclick=()=>{ r.itinerary = r.itinerary.filter(x=>x.id!==it.id); saveState(); renderPanel(); renderList(); }; li.appendChild(chk); li.appendChild(txt); li.appendChild(del); body.appendChild(li); }); }
      }

      if(activeTab==='shopping'){
        const add = document.createElement('div'); add.className='card'; add.innerHTML = `<div style=\"font-weight:700;margin-bottom:8px\">Lista de Supermercado</div>`;
        const row = document.createElement('div'); row.className='input-row'; const input = document.createElement('input'); input.placeholder='Ej. Agua, Cervezas, Fruta...'; const addBtn = document.createElement('button'); addBtn.className='btn'; addBtn.textContent='Agregar'; addBtn.onclick = ()=>{ if(input.value.trim()){ r.shoppingList = r.shoppingList || []; r.shoppingList.push({ id:Date.now(), text:input.value, completed:false }); input.value=''; saveState(); renderPanel(); renderList(); }}; row.appendChild(input); row.appendChild(addBtn); add.appendChild(row); body.appendChild(add);

        if(!r.shoppingList || r.shoppingList.length===0){ body.appendChild(Object.assign(document.createElement('div'),{className:'empty',innerHTML:'<div>Lista de compras vacía</div>'})); }
        else{ r.shoppingList.forEach(it=>{ const li = document.createElement('div'); li.className='list-item'+(it.completed? ' completed':''); const chk = document.createElement('input'); chk.type='checkbox'; chk.checked=!!it.completed; chk.onchange = ()=>{ it.completed = chk.checked; saveState(); renderPanel(); renderList(); }; const txt = document.createElement('div'); txt.className='text'; txt.textContent = it.text; const del = document.createElement('button'); del.className='btn ghost'; del.textContent='Eliminar'; del.onclick=()=>{ r.shoppingList = r.shoppingList.filter(x=>x.id!==it.id); saveState(); renderPanel(); renderList(); }; li.appendChild(chk); li.appendChild(txt); li.appendChild(del); body.appendChild(li); }); }
      }

      panelEl.appendChild(body);
    }

    // Renders
    function render(){ renderFilters(); renderList(); renderPanel(); }

    // Event handlers
    qEl.addEventListener('input', ()=>{ render(); });

    // Inicial
    render();

    console.log('UI elegante cargada (persistencia habilitada)');
  </script>
</body>
</html>
